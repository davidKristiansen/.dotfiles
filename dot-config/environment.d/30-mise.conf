# Send `mise use -g` into a tracked file. Without this it writes
# $XDG_CONFIG_HOME/mise/config.toml, which is a real file rather than a stow
# symlink (only conf.d/ is linked in), so a pin made that way never reaches the
# repo -- herdr and ollama both drifted out that way.
MISE_GLOBAL_CONFIG_FILE=$XDG_CONFIG_HOME/mise/local.toml

# vim: set ft=ini:
