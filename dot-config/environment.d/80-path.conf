# systemd discards PATH lines in environment.d(5) and substitutes its
# built-in default, so this line only reaches interactive shells, which
# source these files from .zshenv. The session PATH for GUI apps and user
# units comes from the dbus-update-activation-environment line in
# sway/startup_applications — keep the two lists in step.
PATH=$XDG_BIN_HOME:$HOME/.local/share/mise/shims:$PATH

# vim: set ft=ini:

