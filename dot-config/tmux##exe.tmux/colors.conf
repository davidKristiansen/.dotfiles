# Gruvbox Dark Hard colors (terminal bg: #1d2021).
# status-left/right content lives in tpipeline.conf (sourced later, would
# shadow anything set here).

# Inherit terminal bg for status
set -g status-style bg=default,fg=colour223

# Active window
set -g window-status-current-style bg=colour237,fg=colour223
set -g window-status-current-format " #[bold]#I:#W "

# Inactive windows
set -g window-status-style bg=default,fg=colour246
set -g window-status-format " #I:#W "

# Pane borders
# Plain single-line dividers. herdr's boxed-pane look was tried here and
# dropped: tmux draws ONE shared divider between panes, has no padding option,
# and emits no corner glyphs (verified — only ─ │ ├ junctions appear, never
# ┌ ┐ └ ┘), so a real frame-plus-gap is not reachable.
set -g pane-border-lines single

# pane-border-status is deliberately left off. `top` puts a titled rail on each
# pane's top border, which makes every divider part-text/part-line and spans
# only that pane's width. Set to `top` to re-enable; the format below is inert
# while it is off.
set -g pane-border-status off
# set -g pane-border-format ' #{?pane_active,#[fg=colour142]#[bold],#[fg=colour245]}#{pane_index}:#{pane_current_command}#[default] '

# Active pane border uses gruvbox bright green (colour142), matching the
# `accent = "#b8bb26"` set in ~/.config/herdr/config.toml. Was colour241 grey.
set -g pane-border-style fg=colour239
set -g pane-active-border-style fg=colour142

# `colour` (the tmux default) tints the active pane's dividers. Not `arrows` or
# `both`: the arrow glyphs sit mid-border and read as another partial border.
set -g pane-border-indicators colour

# No scrollbars. Tried `on` and `modal` and both were dropped: the scrollbar
# occupies a real column at each pane's right edge, so it reads as a second
# stray border next to the divider (and against the window's right edge).
set -g pane-scrollbars off

# Messages / command prompt
set -g message-style bg=colour237,fg=colour223
set -g message-command-style bg=colour237,fg=colour223

# Copy mode highlight
setw -g mode-style bg=colour142,fg=default

