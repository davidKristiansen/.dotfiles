# Keybindings. Sourced last (after plugins.conf), so unbinds here reliably
# override plugin-installed maps.

# --- Config reload -----------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# --- Splits (inherit the current pane's working directory) ---------------------
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# --- Session -----------------------------------------------------------------
# `.` repurposed: move-window (default) -> rename-session
unbind .
bind . command-prompt -p "Rename session:" "rename-session '%%'"

# --- Copy mode (vi) ------------------------------------------------------------
# v begins, y / Enter copy the selection to the system clipboard via OSC 52
# (set-clipboard on, see general.conf). Mouse-drag copy keeps tmux's default
# binding, which also honors set-clipboard.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# --- Popups --------------------------------------------------------------------
# Shared popup styling (%hidden: config-parse variables, not exported).
%hidden popup_bg="bg=colour235"
%hidden todo_border="fg=colour142"
%hidden save_border="fg=colour109"

# Todo float (obsidian vault)
# prefix + t : compact quick-glance (toggle)
# prefix + T : full editor (toggle)          (shadows nothing by default)
# prefix + a : quick-add to inbox
bind t display-popup -E -b rounded -S "$todo_border" -s "$popup_bg" \
  -T " 󰄬 Todo " -w 40% -h 50% "$HOME/.local/bin/tmux-todo"
bind T display-popup -E -b rounded -S "$todo_border" -s "$popup_bg" \
  -T " 󰄬 Todo " -w 80% -h 80% "$HOME/.local/bin/tmux-todo"
bind a display-popup -E -b rounded -S "$todo_border" -s "$popup_bg" \
  -T " 󰐖 Add Task " -w 50% -h 3 "$HOME/.local/bin/tmux-todo-add"

# Window save/restore
# prefix + S : save current window layout (panes, cwds, commands)
# prefix + s : restore a saved window via fzf picker
#              NOTE: shadows the default `s` (choose-tree session picker);
#              use `prefix + w` for the built-in session/window tree instead.
bind S display-popup -E -b rounded -S "$save_border" -s "$popup_bg" \
  -T "  Save Window " -w 40% -h 4 "$HOME/.local/bin/tmux-save-window"
bind s display-popup -E -b rounded -S "$save_border" -s "$popup_bg" \
  -T "  Restore Window " -w 60% -h 50% "$HOME/.local/bin/tmux-restore-window"

# --- workmux --------------------------------------------------------------------
# prefix + g opens the `workmux` key table, like the g commands in vim. The next
# key picks the action. A key that the table does not bind, or Escape, closes it.
#   j / k   : next / previous agent in sidebar order (repeat j or k, no prefix)
#   g       : first agent (gg)
#   1-9     : agent N
#   d       : dashboard popup
#   s       : sidebar on / off
#   a       : add a worktree and window for a branch in the current repo
# The mise shim finds workmux when the server PATH has no mise entries.
%hidden wm="$HOME/.local/share/mise/shims/workmux"
%hidden wm_border="fg=colour175"
bind g switch-client -T workmux
bind -T workmux Escape switch-client -T root
bind -r -T workmux j run-shell -b "$wm sidebar next"
bind -r -T workmux k run-shell -b "$wm sidebar prev"
bind -T workmux g run-shell -b "$wm sidebar jump 1"
bind -T workmux 1 run-shell -b "$wm sidebar jump 1"
bind -T workmux 2 run-shell -b "$wm sidebar jump 2"
bind -T workmux 3 run-shell -b "$wm sidebar jump 3"
bind -T workmux 4 run-shell -b "$wm sidebar jump 4"
bind -T workmux 5 run-shell -b "$wm sidebar jump 5"
bind -T workmux 6 run-shell -b "$wm sidebar jump 6"
bind -T workmux 7 run-shell -b "$wm sidebar jump 7"
bind -T workmux 8 run-shell -b "$wm sidebar jump 8"
bind -T workmux 9 run-shell -b "$wm sidebar jump 9"
bind -T workmux s run-shell -b "$wm sidebar"
bind -T workmux d display-popup -E -b rounded -S "$wm_border" -s "$popup_bg" \
  -T " 󰚩 workmux " -w 90% -h 80% "$wm dashboard"
# -EE keeps the popup open when `workmux add` fails, so the error stays visible.
bind -T workmux a command-prompt -p "workmux add:" \
  "display-popup -EE -b rounded -S '$wm_border' -s '$popup_bg' -T ' 󰐖 workmux add ' -w 60% -h 30% -d '#{pane_current_path}' \"$wm add '%%'\""

# --- Fast pane navigation -------------------------------------------------------
# Both vim-tmux-navigator (C-hjkl) and tilish (M-hjkl) ship an is_vim guard that
# shells out on EVERY keypress:
#   if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '...'"
# Measured on this machine: ~925 ms per press (20 runs took 18.5 s, 14.8 s of it
# system time — `ps -t` walks all of /proc to resolve the tty). That is the
# navigation lag.
#
# `if-shell -F` evaluates a tmux format instead, inside the server, with no fork
# at all. #{m/ri:...} is a case-insensitive regex match (tmux 3.1+) against
# #{pane_current_command}, which tmux already tracks. Verified classification:
#   nvim/vim/vi/view/nvimdiff/gvim/nvim-wrapped/fzf -> 1
#   zsh/bash/less/htop/claude/node/python           -> 0
#
# Two guards, to preserve each plugin's existing behaviour exactly: the
# navigator's version passes keys through to fzf, tilish's does not. Stored as
# user options rather than %hidden vars so the resolved pattern stays
# inspectable (`tmux show-options -gv @is_vim`) and can be evaluated against a
# live pane with `tmux display-message -p -t <pane> '#{E:@is_vim}'`.
set -g @is_vim_fzf '#{m/ri:^(\S+/)?g?\.?(l?n?vim?x?|view|fzf)(diff)?(-wrapped)?$,#{pane_current_command}}'
set -g @is_vim     '#{m/ri:^(\S+/)?g?\.?(l?n?vim?x?|view)(diff)?(-wrapped)?$,#{pane_current_command}}'

# vim-tmux-navigator replacement (sourced after plugins.conf, so this wins).
bind -n C-h if-shell -F '#{E:@is_vim_fzf}' 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell -F '#{E:@is_vim_fzf}' 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell -F '#{E:@is_vim_fzf}' 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell -F '#{E:@is_vim_fzf}' 'send-keys C-l' 'select-pane -R'

# tilish replacement (@tilish-navigator on installs the same slow guard).
bind -n M-h if-shell -F '#{E:@is_vim}' 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell -F '#{E:@is_vim}' 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell -F '#{E:@is_vim}' 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell -F '#{E:@is_vim}' 'send-keys M-l' 'select-pane -R'

# --- Passthrough ----------------------------------------------------------------
# Let Ctrl-\ reach applications (SIGQUIT); vim-tmux-navigator binds it to
# "last pane", which we deliberately drop.
unbind -T root C-\\
unbind -T copy-mode-vi C-\\

# vim: set ft=tmux ts=2 sw=2:
