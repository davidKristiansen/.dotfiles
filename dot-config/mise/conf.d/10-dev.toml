# Lightweight dev tools — installed everywhere, including devcontainers.
# Toolchains (rust, cmake, …) live in 00-core.toml; host-only utilities
# live in 20-host.toml##!container.

[tools]
# Node (runtime is declared once in 00-core.toml)
npm = "latest"
"npm:prettier" = "latest"

# Python
python = "3.14"
pipx = "latest"
uv = "0.11.24"
"pipx:xonsh" = { version = "latest", extras = "full" }  # Python shell; extras=full → ptk editor + pygments
ty = "latest"
ruff = "latest"

# Go
go = "latest"

# Java — mason builds groovy-language-server with gradle, which needs a JDK.
# Ubuntu ships only a JRE, so this must be everywhere nvim runs.
java = "temurin-21"

# Lua
stylua = "latest"

# Git / CI
pre-commit = "latest"
github-cli = "latest"
sqlite = "latest"
